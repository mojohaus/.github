name: Bug report
description: A MojoHaus plugin behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security vulnerability, please **stop** and follow
        [SECURITY.md](https://github.com/mojohaus/.github/blob/master/SECURITY.md) instead; don't file it here.

  - type: input
    id: version
    attributes:
      label: Plugin version
      description: Which version of the plugin are you using?
      placeholder: "e.g. versions-maven-plugin 2.23.0"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: JDK and Maven version
      description: Output of `mvn -v` is ideal.
      placeholder: "e.g. Maven 3.9.16, Temurin 21.0.12, Linux"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include the stack trace or the relevant `mvn -e` output if there is one.
    validations:
      required: true

  - type: textarea
    id: reproducer
    attributes:
      label: How can we reproduce it?
      description: >
        A minimal project, a failing integration test, or the relevant POM snippet. This is
        usually the difference between an issue that gets fixed and one that stalls.
    validations:
      required: false
