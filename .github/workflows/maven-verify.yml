# MojoHaus build: apache/maven-gh-actions-shared maven-verify.yml@v5 with the settings every
# MojoHaus plugin shares, so a repository passes only what it does differently.
#
# Only the inputs MojoHaus repositories set are exposed here, and each default below must match
# the one in maven-verify.yml@v5: when v5 changes a default, such as the JDK matrix, change it here
# too, or MojoHaus keeps the old one.

name: Verify

on:
  workflow_call:
    inputs:
      os-matrix:
        description: Operating systems to build on, as a JSON array.
        required: false
        default: '[ "ubuntu-latest", "windows-latest", "macos-latest" ]'
        type: string

      jdk-matrix:
        description: JDKs to build with, as a JSON array.
        required: false
        default: '[ "21", "25", "8" ]'
        type: string

      matrix-exclude:
        description: >-
          Matrix entries to skip, as a JSON array. By default Linux runs every JDK, Windows the oldest
          and the newest, and macOS only the newest (mojohaus/.github#12).
        required: false
        default: >
          [
            {"os": "macos-latest", "jdk": "8"},
            {"os": "macos-latest", "jdk": "21"},
            {"os": "windows-latest", "jdk": "21"}
          ]
        type: string

      ff-goal:
        description: Goal of the fail-fast build.
        required: false
        default: '-P "?run-its" verify'
        type: string

      verify-goal:
        description: Goal of the matrix builds.
        required: false
        default: '-P "?run-its" verify'
        type: string

      verify-fail-fast:
        description: Cancel the other matrix builds when one fails.
        required: false
        default: true
        type: boolean

      ff-site-goal:
        description: Goal of the site build in the fail-fast job.
        required: false
        default: '-DskipTests -P reporting compile site site:stage'
        type: string

      timeout-minutes:
        description: Timeout of each matrix build, in minutes.
        required: false
        default: 30
        type: number

      maven4-enabled:
        description: >-
          Also build with Maven 4. Turn it off for a plugin that still targets Maven 3 only, such as one
          built on the Maven 2 compatibility layer.
        required: false
        default: true
        type: boolean

jobs:
  matrix:
    name: Matrix
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      exclude: ${{ steps.matrix.outputs.exclude }}
      include: ${{ steps.matrix.outputs.include }}
    steps:
      # The Linux runners have no JDK 8 in the tool cache, and the Temurin 8 download fails now and
      # then (HTTP 403, checksum mismatch): build JDK 8 on Linux with Zulu. Windows keeps its cached Temurin 8.
      - id: matrix
        env:
          OS_MATRIX: ${{ inputs.os-matrix }}
          JDK_MATRIX: ${{ inputs.jdk-matrix }}
          MATRIX_EXCLUDE: ${{ inputs.matrix-exclude }}
        run: |
          jq -cn --argjson oses "$OS_MATRIX" --argjson jdks "$JDK_MATRIX" --argjson dists '["temurin"]' \
            --argjson exclude "$MATRIX_EXCLUDE" --argjson include '[]' '
            ([$oses[] | select(startswith("ubuntu"))][0]) as $os
            | ([$jdks[] | select(tostring == "8")][0]) as $jdk
            | if $os == null or $jdk == null or ($dists | index("temurin")) == null
                 or any($exclude[]; (keys - ["os", "jdk", "distribution"] | length) == 0
                        and (.os // $os) == $os and ((.jdk // $jdk) | tostring) == "8"
                        and (.distribution // "temurin") == "temurin")
              then {exclude: $exclude, include: $include}
              else {exclude: ($exclude + [{os: $os, jdk: $jdk, distribution: "temurin"}]),
                    include: ($include + [{os: $os, jdk: $jdk, distribution: "zulu"}])}
              end
            | "exclude=\(.exclude | tojson)\ninclude=\(.include | tojson)"' -r | tee -a "$GITHUB_OUTPUT"

  verify:
    name: Verify
    needs: matrix
    # Same-repo PRs are already built by the push event; their pull_request run
    # is a duplicate. Skip the reusable-workflow call at this level so the checks
    # UI shows one named "Verify" check instead of nested jobs whose matrix/needs
    # expressions cannot be rendered when the upstream setup job is skipped.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    uses: apache/maven-gh-actions-shared/.github/workflows/maven-verify.yml@v5
    with:
      # Temurin comes from the runners' tool cache; Zulu would be downloaded or restored from the cache
      jdk-distribution-matrix: '[ "temurin" ]'
      ff-jdk-distribution: 'temurin'
      # no extra toolchain JDKs: each job registers only its own JDK in toolchains.xml, so macOS, which
      # caches no JDK, downloads one instead of five
      jdk-toolchain: ''
      ff-jdk-toolchain: ''
      maven4-enabled: ${{ inputs.maven4-enabled }}
      # only the default branch saves the Maven and JDK caches; other branches and pull requests restore them
      cache-save-default-branch-only: true
      os-matrix: ${{ inputs.os-matrix }}
      jdk-matrix: ${{ inputs.jdk-matrix }}
      matrix-exclude: ${{ needs.matrix.outputs.exclude }}
      matrix-include: ${{ needs.matrix.outputs.include }}
      ff-goal: ${{ inputs.ff-goal }}
      verify-goal: ${{ inputs.verify-goal }}
      verify-fail-fast: ${{ inputs.verify-fail-fast }}
      ff-site-goal: ${{ inputs.ff-site-goal }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
