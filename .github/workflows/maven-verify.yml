# MojoHaus build: apache/maven-gh-actions-shared maven-verify.yml@v5 with the settings every
# MojoHaus plugin shares, so a repository passes only what it does differently.
#
# Only the inputs MojoHaus repositories set are exposed here, and each default below must match
# the one in maven-verify.yml@v5. A repository that needs another input (jdk-matrix, os-matrix,
# maven-matrix) calls apache/maven-gh-actions-shared directly.

name: Verify

on:
  workflow_call:
    inputs:
      matrix-exclude:
        description: >-
          Matrix entries to skip, as a JSON array. By default Linux runs every JDK, Windows the oldest
          and the newest, and macOS only the newest (mojohaus/.github#12).
        required: false
        default: >
          [
            {"os": "macos-latest", "jdk": "8"},
            {"os": "macos-latest", "jdk": "21"},
            {"os": "windows-latest", "jdk": "21"}
          ]
        type: string

      ff-goal:
        description: Goal of the fail-fast build.
        required: false
        default: '-P run-its verify'
        type: string

      verify-goal:
        description: Goal of the matrix builds.
        required: false
        default: '-P run-its verify'
        type: string

      verify-fail-fast:
        description: Cancel the other matrix builds when one fails.
        required: false
        default: true
        type: boolean

      ff-site-goal:
        description: Goal of the site build in the fail-fast job.
        required: false
        default: '-DskipTests -P reporting compile site site:stage'
        type: string

      timeout-minutes:
        description: Timeout of each matrix build, in minutes.
        required: false
        default: 30
        type: number

jobs:
  verify:
    name: Verify
    uses: apache/maven-gh-actions-shared/.github/workflows/maven-verify.yml@v5
    with:
      # Temurin comes from the runners' tool cache; Zulu would be downloaded or restored from the cache
      jdk-distribution-matrix: '[ "temurin" ]'
      ff-jdk-distribution: 'temurin'
      maven4-enabled: true
      # only the default branch saves the Maven and JDK caches; other branches and pull requests restore them
      cache-save-default-branch-only: true
      matrix-exclude: ${{ inputs.matrix-exclude }}
      ff-goal: ${{ inputs.ff-goal }}
      verify-goal: ${{ inputs.verify-goal }}
      verify-fail-fast: ${{ inputs.verify-fail-fast }}
      ff-site-goal: ${{ inputs.ff-site-goal }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
