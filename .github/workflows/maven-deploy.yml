name: Deploy

# declare no permissions for GITHUB_TOKEN
permissions: {}

on:
  workflow_call:

# allow single build
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy

    if: |
      github.event_name == 'push' &&
      github.repository_owner == 'mojohaus' &&
      github.ref == 'refs/heads/master' &&
      !startsWith(github.event.head_commit.message , '[maven-release-plugin] prepare release')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          # the snapshot repository id in mojo-parent's distributionManagement
          server-id: sonatype-central-portal
          server-username: MAVEN_DEPLOY_UID
          server-password: MAVEN_DEPLOY_PWD

      - name: Publish Snapshot
        run: mvn --errors --batch-mode --show-version deploy -DskipTests
        env:
          MAVEN_DEPLOY_UID: ${{ secrets.MAVEN_DEPLOY_UID }}
          MAVEN_DEPLOY_PWD: ${{ secrets.MAVEN_DEPLOY_PWD }}
